name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host-tests:
    name: Host logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run mic + UI test suites
        run: ./firmware/test/run.sh

  firmware-build:
    name: Firmware build (XIAO ESP32S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        working-directory: firmware
        run: pio run -e seeed_xiao_esp32s3
